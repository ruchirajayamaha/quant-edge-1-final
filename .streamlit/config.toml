[theme]
primaryColor = "#0f6b6b"
backgroundColor = "#fbf8f1"
secondaryBackgroundColor = "#f4efe3"
textColor = "#16263d"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
# A hosted update must not purge quantedge from sys.modules while a session imports it.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
