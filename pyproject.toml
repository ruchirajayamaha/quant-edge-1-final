[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantedge"
version = "0.1.0"
description = "Quant Edge 1.0 competition analytics and Streamlit decision-support baseline for a conservative USD 10M university endowment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.13,<2.0",
    "statsmodels>=0.14,<1.0",
    "pyarrow>=17.0,<23.0",
    "PyYAML>=6.0,<7.0",
    "requests>=2.31,<3.0",
    "yfinance>=0.2.50,<2.0",
    "plotly>=5.22,<7.0",
    "streamlit>=1.38,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
